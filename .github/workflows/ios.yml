name: iOS quality gate

on:
  pull_request:
  push:
    branches: [main, redesign/consumer-visual-hierarchy, codex/redesign-compass-account-hub]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Verify approved companion cast and assets
        run: scripts/dev/verify-factory-assets.sh

      - name: Install project generator
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec Project.json

      - name: Resolve pinned packages
        run: xcodebuild -resolvePackageDependencies -project Simastry.xcodeproj -scheme Simastry

      - name: Debug build
        run: >-
          xcodebuild build
          -project Simastry.xcodeproj
          -scheme Simastry
          -configuration Debug
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Release build
        run: >-
          xcodebuild build
          -project Simastry.xcodeproj
          -scheme Simastry
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for devices in d.values() for x in devices if x["name"].startswith("iPhone") and x["isAvailable"]))')"
          xcodebuild test \
            -project Simastry.xcodeproj \
            -scheme Simastry \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -only-testing:SimastryTests \
            CODE_SIGNING_ALLOWED=NO
